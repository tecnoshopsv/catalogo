<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Catálogo Mayorista · TECNOSHOPSV</title>
<meta name="theme-color" content="#4B1F7A">
<style>
  body{margin:0;background:#4B1F7A;color:#fff;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center}
  .c b{display:block;font-size:22px;letter-spacing:.5px}.c b span{color:#FFC52E}
  .c p{opacity:.8;margin:8px 0 0}
</style>
</head>
<body>
<div class="c"><b>TECNOSHOP<span>SV</span></b><p id="m">Cargando catálogo…</p></div>
<script>
// Esta página trae el catálogo desde Google Apps Script. Los cambios del catálogo se ven aquí solos.
var API = 'https://script.google.com/macros/s/AKfycbweF6GVeLUBF6zIiUuPS6CsVSzKyabDV1kHrXgehpmQKnXVa40yqGPw6ltA3fjebQCLxw/exec';
var CLAVE = 'tsv_pagina';
// Fotos de referencia por modelo y color: son las mismas de tecnoshopsv.com/fotos ("modelo--color.webp").
// Para agregar una: subirla a la carpeta fotos del repo "tienda" y anotar su nombre aquí (lista de abajo).
var FOTOS = 'iphone-11--blanco iphone-11--morado iphone-11--negro iphone-11-pro-max--blanco iphone-11-pro-max--dorado iphone-11-pro-max--negro iphone-11-pro-max--verde iphone-12--azul iphone-12--negro iphone-12--verde iphone-13--blanco iphone-13--celeste iphone-13--negro iphone-13--rojo iphone-13--verde iphone-13-pro--blanco iphone-13-pro--celeste iphone-13-pro--dorado iphone-13-pro--negro iphone-13-pro--verde iphone-13-pro-max--negro iphone-14--blanco iphone-14--negro iphone-14-pro--negro iphone-14-pro-max--negro iphone-15--amarillo iphone-15-plus--rosado iphone-15-pro--negro iphone-15-pro-max--azul iphone-16-pro--dorado iphone-16-pro-max--dorado iphone-16-pro-max--gris iphone-16-pro-max--negro iphone-17-pro-max--anaranjado iphone-17-pro-max--azul iphone-17-pro-max--blanco samsung-s21-ultra--negro samsung-s21-ultra--silver samsung-s22-ultra--blanco samsung-s22-ultra--burgundy samsung-s22-ultra--negro samsung-s22-ultra--verde samsung-s23-ultra--negro samsung-s25--celeste samsung-s25-ultra--celeste samsung-s25-ultra--gris samsung-s26--negro samsung-z-flip-4--amarillo samsung-z-flip-4--blanco samsung-s24-ultra--gris samsung-s24-ultra--negro samsung-a17--negro samsung-a17--celeste samsung-a17--gris iphone-15-pro-max--blanco iphone-15-pro-max--gris samsung-s26--morado'.split(' ');
function conFotos(html){
  var mapa = {};
  FOTOS.forEach(function(f){ var p = f.split('--'); mapa[p[0].replace(/-/g, ' ') + '|' + p[1].replace(/-/g, ' ')] = 'https://tecnoshopsv.com/fotos/' + f + '.webp'; });
  return html.replace(/var IMAGENES\s*=\s*\{\s*\};/, function(){ return 'var IMAGENES = ' + JSON.stringify(mapa) + ';'; });
}
function mostrar(html){
  html = conFotos(html);
  // Esperar a que esta página termine de cargar; si no, el catálogo se mete dentro de la pantalla "Cargando…" en vez de reemplazarla.
  function ir(){ document.open(); document.write(html); document.close(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', ir); else ir();
}
var guardada = null;
try { guardada = localStorage.getItem(CLAVE); } catch (e) {}
var nueva = fetch(API + '?fn=pagina').then(function(r){ return r.json(); }).then(function(j){
  if (j && j.html) { try { localStorage.setItem(CLAVE, j.html); } catch (e) {} }
  return j && j.html;
});
if (guardada) {
  mostrar(guardada);             // abre al instante con la última versión guardada
} else {
  nueva.then(function(h){ if (h) mostrar(h); else throw 0; })
       .catch(function(){ document.getElementById('m').textContent = 'No se pudo cargar. Revisa tu conexión y recarga.'; });
}
</script>
</body>
</html>
