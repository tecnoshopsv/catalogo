<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Repuestos para talleres · TECNOSHOPSV</title>
<meta name="description" content="Catálogo de repuestos para talleres: pantallas, baterías y más, con precios de mayoreo.">
<meta name="theme-color" content="#4B1F7A">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/icono-180.png">
<style>
  :root{
    --morado:#4B1F7A; --morado-2:#6A2FA8; --amarillo:#FFC52E;
    --fondo:#F5F3F8; --tarjeta:#FFFFFF; --texto:#1E1A24; --suave:#6B6475; --linea:#E6E1EC;
    --verde:#0E6B4E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--fondo);color:var(--texto);
    font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}
  button{font:inherit}
  header{background:var(--morado);color:#fff;padding:14px 16px 16px}
  .cab{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:760px;margin:0 auto}
  .marca{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
  .marca img{width:44px;height:44px;border-radius:10px;background:#fff1}
  .marca b{display:block;font-size:18px;letter-spacing:.2px}
  .marca span{font-size:12px;opacity:.85}
  .ir-cat{color:#fff;font-size:13px;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:6px 12px;text-decoration:none;white-space:nowrap}
  .barra{position:sticky;top:0;z-index:5;background:var(--fondo);padding:10px 16px 8px;border-bottom:1px solid var(--linea)}
  .barra .dentro{max-width:760px;margin:0 auto}
  #q{width:100%;padding:12px 14px;border:1px solid var(--linea);border-radius:12px;font-size:16px;background:#fff}
  .chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--linea);background:#fff;color:var(--texto);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer}
  .chip.on{background:var(--morado);border-color:var(--morado);color:#fff}
  .chip .n{opacity:.7;margin-left:4px;font-size:12px;font-weight:500}
  main{max-width:760px;margin:0 auto;padding:12px 16px 120px}
  .migas{font-size:13px;color:var(--suave);margin:4px 0 10px}
  .migas button{border:0;background:none;color:var(--morado);font-weight:700;padding:0;cursor:pointer;font-size:13px}
  h2{font-size:20px;margin:6px 0 4px}
  .sub{color:var(--suave);font-size:13px;margin:0 0 14px}
  .marcas{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .marca-btn{border:0;border-radius:18px;padding:22px 12px;color:#fff;cursor:pointer;text-align:center;
    background:linear-gradient(145deg,var(--morado-2),var(--morado));box-shadow:0 6px 16px rgba(75,31,122,.22)}
  .marca-btn:nth-child(even){background:linear-gradient(145deg,#2C2533,#15121A)}
  .marca-btn .nom{display:block;font-size:22px;font-weight:800}
  .marca-btn .uni{display:inline-block;margin-top:8px;background:var(--amarillo);color:#3a2a00;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
  .modelos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .modelo-btn{border:1px solid var(--linea);background:#fff;border-radius:14px;padding:14px 12px;text-align:left;cursor:pointer}
  .modelo-btn b{display:block;font-size:15px}
  .modelo-btn span{font-size:12px;color:var(--suave)}
  .modelo-btn:active,.marca-btn:active{transform:scale(.98)}
  .grupo{background:#fff;border:1px solid var(--linea);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .grupo-cab{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;background:#FBF9FD;border-bottom:1px solid var(--linea)}
  .grupo-cab h3{margin:0;font-size:16px}
  .grupo-cab span{font-size:12px;color:var(--suave)}
  .rep{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:11px 14px;border-top:1px solid var(--linea);align-items:center}
  .rep:first-of-type{border-top:0}
  .rep .t{font-weight:700}
  .cal{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:#F1EAF9;color:var(--morado);margin-left:6px;vertical-align:1px}
  .rep .o{font-size:12px;color:var(--suave);grid-column:1}
  .rep .p{font-size:18px;font-weight:800;color:var(--morado);text-align:right;white-space:nowrap}
  .rep .acc{grid-column:1 / -1;display:flex;gap:8px;margin-top:6px}
  .btn{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .btn-add{background:var(--morado);color:#fff}
  .btn-wa{background:#fff;color:var(--verde);border:1px solid #BFE3D2}
  .paso{display:inline-flex;align-items:center;gap:8px;background:#F1EAF9;border-radius:10px;padding:4px}
  .paso button{border:0;background:#fff;color:var(--morado);width:30px;height:30px;border-radius:8px;font-size:18px;font-weight:800;cursor:pointer}
  .paso span{font-size:13px;font-weight:700;color:var(--morado);min-width:70px;text-align:center}
  .vacio{background:#fff;border:1px dashed var(--linea);border-radius:14px;padding:22px;text-align:center;color:var(--suave)}
  .info{margin-top:18px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px;font-size:13px;color:var(--suave)}
  .info b{color:var(--texto)}
  .barra-pedido{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--morado);color:#fff;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
  .barra-pedido[hidden]{display:none}
  .barra-pedido b{font-size:16px}
  .barra-pedido button{border:0;background:var(--amarillo);color:#3a2a00;font-weight:800;border-radius:10px;padding:10px 14px;cursor:pointer}
  .fondo-modal{position:fixed;inset:0;background:rgba(20,10,30,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
  .fondo-modal[hidden]{display:none}
  .modal{background:#fff;width:100%;max-width:560px;max-height:88vh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
  .modal-cab{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--linea)}
  .modal-cab h3{margin:0;font-size:17px}
  .cerrar{border:0;background:#F1EAF9;color:var(--morado);width:34px;height:34px;border-radius:50%;font-size:20px;cursor:pointer}
  .modal-cuerpo{overflow:auto;padding:4px 16px}
  .linea{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-bottom:1px solid var(--linea)}
  .linea .t{font-weight:600;font-size:14px}
  .linea .s{font-size:12px;color:var(--suave)}
  .modal-pie{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--linea)}
  .modal-pie input{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:10px;font-size:15px;margin-bottom:8px}
  .total{display:flex;justify-content:space-between;font-weight:800;font-size:16px;margin-bottom:10px}
  .enviar{width:100%;border:0;background:#1FA855;color:#fff;font-weight:800;font-size:16px;border-radius:12px;padding:13px;cursor:pointer}
  .vaciar{width:100%;border:0;background:none;color:var(--suave);text-decoration:underline;padding:8px;cursor:pointer;font-size:13px}
  .estado{font-size:12px;color:var(--suave);text-align:center;margin-top:16px}
  .toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%) translateY(140px);background:var(--texto);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;transition:transform .25s;max-width:90vw;text-align:center}
  .toast.ver{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="cab">
    <a class="marca" href="/repuestos/"><img src="/icono-180.png" alt=""><div><b>TecnoShopSV Repuestos</b><span>Precios para talleres · mayoreo</span></div></a>
    <a class="ir-cat" href="/">Ver equipos</a>
  </div>
</header>
<div class="barra"><div class="dentro">
  <input id="q" type="search" placeholder="Busca modelo o repuesto: iPhone 13 pantalla…" autocomplete="off">
  <div class="chips" id="chips"></div>
</div></div>
<main id="app"><div class="vacio">Cargando repuestos…</div></main>

<div class="barra-pedido" id="barraPedido" hidden>
  <div>Tu pedido: <b id="bpN">0</b> · <b id="bpT">$0.00</b></div>
  <button id="verPedido" type="button">Ver y enviar</button>
</div>
<div class="fondo-modal" id="modalPedido" hidden><div class="modal" role="dialog" aria-labelledby="pedTit">
  <div class="modal-cab"><h3 id="pedTit">Tu pedido de repuestos</h3><button class="cerrar" id="cerrarPedido" aria-label="Cerrar">×</button></div>
  <div class="modal-cuerpo" id="pedLista"></div>
  <div class="modal-pie">
    <input id="pedTaller" maxlength="60" placeholder="Nombre de tu taller (opcional)">
    <div class="total"><span>Total</span><span id="pedTotal">$0.00</span></div>
    <button class="enviar" id="enviarPedido" type="button">Enviar pedido por WhatsApp</button>
    <button class="vaciar" id="vaciarPedido" type="button">Vaciar pedido</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>

<script>
var API = 'https://script.google.com/macros/s/AKfycbweF6GVeLUBF6zIiUuPS6CsVSzKyabDV1kHrXgehpmQKnXVa40yqGPw6ltA3fjebQCLxw/exec';
var WHATSAPP = '50370012323';
var GUARDA = 'tsv_rep', GUARDA_PED = 'tsv_rep_pedido', GUARDA_TALLER = 'tsv_rep_taller';
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function dinero(n){ n = Number(n || 0); return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function norm(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ').trim(); }
function slug(s){ return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function leer(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function guardar(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
var tt; function aviso(t){ var el = $('toast'); el.textContent = t; el.classList.add('ver'); clearTimeout(tt); tt = setTimeout(function(){ el.classList.remove('ver'); }, 2400); }

// Datos: filas = [marca, modelo, repuesto, calidad, precio, observaciones]
var items = [], marcas = [], porMarca = {}, modelosDe = {};
var vista = { marca: '', modelo: '', q: '' };
var pedido = leer(GUARDA_PED, {});   // id → cantidad

function idDe(f){ return [f[0], f[1], f[2], f[3]].map(norm).join('|'); }
function recibir(d){
  items = (d.filas || []).map(function(f){ return { id: idDe(f), marca: f[0], modelo: f[1], rep: f[2], cal: f[3], precio: Number(f[4]) || 0, obs: f[5] || '' }; });
  marcas = []; porMarca = {}; modelosDe = {};
  items.forEach(function(x){
    if (!porMarca[x.marca]) { porMarca[x.marca] = 0; marcas.push(x.marca); modelosDe[x.marca] = []; }
    porMarca[x.marca]++;
    if (modelosDe[x.marca].indexOf(x.modelo) < 0) modelosDe[x.marca].push(x.modelo);
  });
  // quitar del pedido lo que ya no existe
  Object.keys(pedido).forEach(function(id){ if (!items.some(function(x){ return x.id === id; })) delete pedido[id]; });
  if (!vista.listo) { vista.listo = true; aplicarHash(); }
  pintar(); pintarPedido();
}
function cargar(){
  fetch(API + '?fn=repuestos').then(function(r){ return r.json(); }).then(function(d){
    if (!d || d.error) throw 0;
    guardar(GUARDA, d); recibir(d);
  }).catch(function(){ if (!items.length) $('app').innerHTML = '<div class="vacio">No se pudo cargar el catálogo. Revisa tu conexión y recarga.</div>'; });
}

// ===== Pantallas =====
function chips(){
  var h = '<button class="chip' + (!vista.marca ? ' on' : '') + '" data-marca="">Inicio</button>';
  marcas.forEach(function(m){ h += '<button class="chip' + (vista.marca === m ? ' on' : '') + '" data-marca="' + esc(m) + '">' + esc(m) + '<span class="n">' + porMarca[m] + '</span></button>'; });
  $('chips').innerHTML = h;
}
function migas(){
  var h = '<div class="migas"><button data-marca="">Inicio</button>';
  if (vista.marca) h += ' › <button data-marca="' + esc(vista.marca) + '">' + esc(vista.marca) + '</button>';
  if (vista.modelo) h += ' › ' + esc(vista.modelo);
  return h + '</div>';
}
function filaRep(x, conModelo){
  var n = pedido[x.id] || 0;
  var acc = n ? '<span class="paso"><button data-menos="' + esc(x.id) + '" aria-label="Quitar uno">−</button><span>' + n + ' en pedido</span><button data-mas="' + esc(x.id) + '" aria-label="Agregar uno">+</button></span>'
              : '<button class="btn btn-add" data-mas="' + esc(x.id) + '">+ Agregar</button>';
  acc += '<a class="btn btn-wa" target="_blank" rel="noopener" href="' + linkWA('Hola, me interesa este repuesto: ' + nombreRep(x) + ' — ' + dinero(x.precio)) + '">Consultar</a>';
  var titulo = conModelo === 'tipo' ? esc(x.cal || x.rep) : esc(x.rep) + (x.cal ? '<span class="cal">' + esc(x.cal) + '</span>' : '');
  return '<div class="rep"><div class="t">' + titulo + '</div>' +
    '<div class="p">' + (x.precio ? dinero(x.precio) : 'Consultar') + '</div>' +
    (x.obs ? '<div class="o">' + esc(x.obs) + '</div>' : '') +
    '<div class="acc">' + acc + '</div></div>';
}
function grupos(lista, porModelo){
  var orden = [], g = {};
  lista.forEach(function(x){ var k = porModelo ? x.marca + ' · ' + x.modelo : x.rep; if (!g[k]) { g[k] = []; orden.push(k); } g[k].push(x); });
  return orden.map(function(k){
    return '<section class="grupo"><div class="grupo-cab"><h3>' + esc(porModelo ? k.split(' · ').slice(1).join(' · ') : k) + '</h3><span>' + g[k].length + (g[k].length === 1 ? ' opción' : ' opciones') + '</span></div>' +
      g[k].map(function(x){ return filaRep(x, porModelo ? '' : 'tipo'); }).join('') + '</section>';
  }).join('');
}
function pintar(){
  chips(); actualizarHash();
  var app = $('app');
  if (!items.length) { app.innerHTML = '<div class="vacio">Muy pronto: estamos cargando nuestro catálogo de repuestos. Escríbenos por WhatsApp para consultar precios.</div>' + info(); return; }
  if (vista.q) {
    var palabras = norm(vista.q).split(' ');
    var res = items.filter(function(x){ var t = norm([x.marca, x.modelo, x.rep, x.cal, x.obs].join(' ')); return palabras.every(function(p){ return t.indexOf(p) >= 0; }); });
    app.innerHTML = '<h2>Resultados</h2><p class="sub">' + res.length + (res.length === 1 ? ' repuesto encontrado' : ' repuestos encontrados') + ' para «' + esc(vista.q) + '»</p>' +
      (res.length ? grupos(res, true) : '<div class="vacio">No encontramos ese repuesto. <a href="' + linkWA('Hola, busco este repuesto: ' + vista.q) + '" target="_blank" rel="noopener">Pregúntanos por WhatsApp</a>, puede que lo tengamos.</div>');
    return;
  }
  if (!vista.marca) {
    app.innerHTML = '<h2>¿Qué marca reparas?</h2><p class="sub">Elige la marca y luego el modelo para ver repuestos y precios de mayoreo.</p>' +
      '<div class="marcas">' + marcas.map(function(m){ return '<button class="marca-btn" data-marca="' + esc(m) + '"><span class="nom">' + esc(m) + '</span><span class="uni">' + modelosDe[m].length + (modelosDe[m].length === 1 ? ' modelo' : ' modelos') + '</span></button>'; }).join('') + '</div>' + info();
    return;
  }
  if (!vista.modelo) {
    var mods = modelosDe[vista.marca] || [];
    app.innerHTML = migas() + '<h2>' + esc(vista.marca) + '</h2><p class="sub">Elige el modelo del equipo que vas a reparar.</p>' +
      '<div class="modelos">' + mods.map(function(mo){
        var n = items.filter(function(x){ return x.marca === vista.marca && x.modelo === mo; }).length;
        return '<button class="modelo-btn" data-modelo="' + esc(mo) + '"><b>' + esc(mo) + '</b><span>' + n + (n === 1 ? ' repuesto' : ' repuestos') + '</span></button>';
      }).join('') + '</div>';
    return;
  }
  var lista = items.filter(function(x){ return x.marca === vista.marca && x.modelo === vista.modelo; });
  app.innerHTML = migas() + '<h2>' + esc(vista.modelo) + '</h2><p class="sub">' + lista.length + (lista.length === 1 ? ' repuesto disponible' : ' repuestos disponibles') + ' · precios de mayoreo</p>' +
    (lista.length ? grupos(lista, false) : '<div class="vacio">No hay repuestos para este modelo.</div>');
}
function info(){
  return '<div class="info"><b>Retiro en tienda:</b> 7a Av. Norte 2-9, Santa Tecla, La Libertad · <b>Horario:</b> lunes a sábado, 8 a.m. a 5 p.m. · Envíos personalizados y departamentales. ' +
    '<br><b>Pagos:</b> efectivo y transferencia. Precios sujetos a cambio; confirma disponibilidad por WhatsApp.</div>';
}

// ===== Enlaces directos: /repuestos/#iphone/iphone-13 =====
function actualizarHash(){
  var h = vista.q ? '' : vista.modelo ? slug(vista.marca) + '/' + slug(vista.modelo) : vista.marca ? slug(vista.marca) : '';
  if (('#' + h) === location.hash || (!h && !location.hash)) return;
  try { history.replaceState(null, '', h ? '#' + h : location.pathname); } catch (e) {}
}
function aplicarHash(){
  var p = decodeURIComponent(location.hash.slice(1)).split('/');
  var m = marcas.filter(function(x){ return slug(x) === slug(p[0]); })[0] || '';
  var mo = m && p[1] ? (modelosDe[m].filter(function(x){ return slug(x) === slug(p[1]); })[0] || '') : '';
  vista.marca = m; vista.modelo = mo;
}
window.addEventListener('hashchange', function(){ if (!location.hash) return; vista.q = ''; $('q').value = ''; aplicarHash(); pintar(); });

// ===== Pedido =====
function nombreRep(x){ return x.rep + ' ' + x.modelo + (x.cal ? ' (' + x.cal + ')' : ''); }
function linkWA(t){ return 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(t); }
function itemPorId(id){ for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i]; return null; }
function cambiar(id, d){
  var n = Math.max(0, (pedido[id] || 0) + d);
  if (n) pedido[id] = n; else delete pedido[id];
  guardar(GUARDA_PED, pedido); pintar(); pintarPedido();
  if (d > 0 && n === 1) aviso('Agregado a tu pedido');
}
function lineasPedido(){ return Object.keys(pedido).map(function(id){ var x = itemPorId(id); return x ? { x: x, n: pedido[id] } : null; }).filter(Boolean); }
function pintarPedido(){
  var ls = lineasPedido(), n = ls.reduce(function(s, l){ return s + l.n; }, 0), t = ls.reduce(function(s, l){ return s + l.n * l.x.precio; }, 0);
  $('barraPedido').hidden = !n; $('bpN').textContent = n + (n === 1 ? ' repuesto' : ' repuestos'); $('bpT').textContent = dinero(t);
  $('pedTotal').textContent = dinero(t);
  $('pedLista').innerHTML = ls.length ? ls.map(function(l){
    return '<div class="linea"><div><div class="t">' + esc(nombreRep(l.x)) + '</div><div class="s">' + esc(l.x.marca) + ' · ' + dinero(l.x.precio) + ' c/u</div></div>' +
      '<span class="paso"><button data-menos="' + esc(l.x.id) + '">−</button><span>' + l.n + '</span><button data-mas="' + esc(l.x.id) + '">+</button></span></div>';
  }).join('') : '<p class="sub" style="padding:14px 0">Tu pedido está vacío.</p>';
  if (!ls.length) $('modalPedido').hidden = true;
}
$('verPedido').addEventListener('click', function(){ $('pedTaller').value = leer(GUARDA_TALLER, ''); $('modalPedido').hidden = false; });
$('cerrarPedido').addEventListener('click', function(){ $('modalPedido').hidden = true; });
$('modalPedido').addEventListener('click', function(e){ if (e.target === $('modalPedido')) $('modalPedido').hidden = true; });
$('vaciarPedido').addEventListener('click', function(){ pedido = {}; guardar(GUARDA_PED, pedido); pintar(); pintarPedido(); });
$('enviarPedido').addEventListener('click', function(){
  var ls = lineasPedido(); if (!ls.length) return;
  var taller = $('pedTaller').value.trim(); guardar(GUARDA_TALLER, taller);
  var t = ls.reduce(function(s, l){ return s + l.n * l.x.precio; }, 0);
  var msg = 'Hola, quiero hacer este pedido de repuestos' + (taller ? ' (' + taller + ')' : '') + ':\n\n' +
    ls.map(function(l){ return '• ' + nombreRep(l.x) + ' x' + l.n + ' — ' + dinero(l.n * l.x.precio); }).join('\n') +
    '\n\nTotal: ' + dinero(t);
  window.open(linkWA(msg), '_blank');
});

// ===== Eventos =====
document.addEventListener('click', function(e){
  var mas = e.target.closest('[data-mas]'); if (mas) { cambiar(mas.getAttribute('data-mas'), 1); return; }
  var menos = e.target.closest('[data-menos]'); if (menos) { cambiar(menos.getAttribute('data-menos'), -1); return; }
  var b = e.target.closest('[data-marca]');
  if (b) { vista.marca = b.getAttribute('data-marca'); vista.modelo = ''; vista.q = ''; $('q').value = ''; pintar(); window.scrollTo(0, 0); return; }
  var mo = e.target.closest('[data-modelo]');
  if (mo) { vista.modelo = mo.getAttribute('data-modelo'); pintar(); window.scrollTo(0, 0); }
});
var deb;
$('q').addEventListener('input', function(e){ clearTimeout(deb); deb = setTimeout(function(){ vista.q = e.target.value.trim(); pintar(); }, 150); });

// Abre al instante con la última copia y se actualiza
var copia = leer(GUARDA, null);
if (copia) recibir(copia);
cargar();
window.addEventListener('focus', cargar);
setInterval(function(){ if (!document.hidden) cargar(); }, 120000);
</script>
